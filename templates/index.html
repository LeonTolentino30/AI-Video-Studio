
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>AI Video Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b14;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
        }

        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            padding: 24px 20px;
        }

        header {
            text-align: center;
            padding: 25px 0;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #a1a1b5;
            font-size: 14px;
        }

        .card {
            background: #181825;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            padding: 15px;
            background: #252538;
            border: 1px solid #414158;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-family: inherit;
        }

        textarea:focus {
            outline: 2px solid #8b5cf6;
        }

        .settings {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            color: #b7b7c9;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(
                135deg, #8b5cf6, #5b21b6
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview {
            background: #181825;
            border-radius: 18px;
            padding: 20px;
            margin-top: 24px;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            max-height: 520px;
            background: #080810;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-top: 15px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #result {
            color: #b7b7c9;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #342451;
            color: #c4b5fd;
            font-size: 12px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #77778d;
            font-size: 12px;
        }
        
        #gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .gallery-item {
            min-width: 0;
            background: #252538;
            border: 1px solid #414158;
            border-radius: 14px;
            padding: 10px;
            overflow: hidden;
        }

        .gallery-item p {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .gallery-item small {
            display: block;
            margin-bottom: 10px;
            color: #c4b5fd;
            font-size: 11px;
        }

        .gallery-item video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16;
            object-fit: contain;
            background: #080810;
            border-radius: 10px;
        }

        #emptyGallery {
            grid-column: 1 / -1;
            color: #a1a1b5;
        }

    </style>
</head>

<body>
    <main class="app">
        <header>
            <h1>🎬 AI Video Studio</h1>
            <p class="subtitle">
                Turn your imagination into video.
            </p>
            <span class="badge" id="modeBadge">
                DEMO MODE
            </span>
        </header>

        <section class="card">
            <label for="prompt">
                ✨ Describe your video
            </label>

            <textarea
                id="prompt"
                maxlength="1000"
                placeholder="Describe the video you want to create..."></textarea>

            <div class="settings">
                <span>📱 Vertical 9:16</span>
                <span>⏱ 5 seconds</span>
            </div>

            <button id="generateBtn"
                    onclick="generateVideo()">
                ✨ Generate Video
            </button>
        </section>

        <section class="preview">
            <label>🎥 Your Video</label>

            <div class="video-box" id="videoBox">
                <div id="result">
                    Your video will appear here.
                </div>
            </div>
            
            <div id="downloadArea"></div>
        </section>
        <section class="card" id="gallerySection">
            <label>🎞️ My Creations</label>
            
            <p class="subtitle">
                Your generated videos will appear here.
            </p>

            <div id="gallery">
                <p id="emptyGallery">
                    No videos saved yet.
                </p>
            </div>
        </section>


        <footer>
            AI Video Studio • iPhone Preview
        </footer>
    </main>

    <script>
        const button =
            document.getElementById("generateBtn");

        const videoBox =
            document.getElementById("videoBox");

        function showMessage(message) {
            videoBox.replaceChildren();

            const messageElement =
                document.createElement("div");

            messageElement.id = "result";
            messageElement.textContent = message;

            videoBox.appendChild(messageElement);
        }

        function sleep(ms) {
            return new Promise(resolve =>
                setTimeout(resolve, ms));
        }
        
        async function loadAppMode() {
            try {
                const response = await fetch("/config");

                if (!response.ok) {
                    throw new Error("Unable to load app mode");
                }

                const config = await response.json();
                const badge = document.getElementById("modeBadge");

                if (!badge) return;

                if (config.real_generation_enabled) {
                    badge.textContent = "✨ REAL AI MODE";
                } else {
                    badge.textContent = "🧪 DEMO MODE";
                }

            } catch (error) {
                console.error("Mode check failed:", error);
            }
        }

        loadAppMode();

        async function loadGallery() {
            const gallery = document.getElementById("gallery");
            if (!gallery) return;

            try {
                const response = await fetch("/gallery");

                if (!response.ok) {
                    throw new Error("Could not load gallery");
                }

                const data = await response.json();

                gallery.replaceChildren();

                if (data.videos.length === 0) {
                    gallery.textContent = "No videos saved yet.";
                    return;
                }

                for (const item of data.videos) {
                    const card = document.createElement("div");
                    card.className = "gallery-item";

                    const prompt = document.createElement("p");
                    prompt.textContent = item.prompt;

                    const mode = document.createElement("small");
                    mode.textContent =
                        item.mode === "mock"
                            ? "🧪 Demo Video"
                            : "✨ AI Generated";

                    card.appendChild(prompt);
                    card.appendChild(mode);

                    if (item.video_url) {
                        const video = document.createElement("video");
                        video.src = item.video_url;
                        video.controls = true;
                        video.playsInline = true;
                        video.preload = "metadata";

                        card.appendChild(video);
                    }
                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "🗑️ Delete Video";

                    deleteButton.onclick = async () => {
                        const confirmed = confirm(
                            "Are you sure you want to remove this video?"
                        );

                        if (!confirmed) return;

                        deleteButton.disabled = true;

                        try {
                            const response = await fetch(`/gallery/${item.id}`, {
                                method: "DELETE"
                            });

                            if (!response.ok) {
                                throw new Error("Unable to delete video");
                            }

                            await loadGallery();

                        } catch (error) {
                            alert("Could not delete video. Please try again.");
                            deleteButton.disabled = false;
                            console.error(error);
                        }
                    };

                    card.appendChild(deleteButton);

                    gallery.appendChild(card);
                }
            } catch (error) {
                gallery.textContent = "Unable to load videos.";
                console.error(error);
            }
        }

        loadGallery();

        async function generateVideo() {
            const prompt =
                document.getElementById("prompt")
                .value.trim();

            if (!prompt) {
                showMessage("Please enter a video prompt.");
                return;
            }

            button.disabled = true;
            document.getElementById("downloadArea").replaceChildren();
            showMessage("Submitting your request...");

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Generation failed"
                    );
                }

                for (let i = 0; i < 120; i++) {
                    await sleep(5000);

                    const statusResponse = await fetch(
                        "/status/" +
                        encodeURIComponent(data.task_id)
                    );

                    const status = await statusResponse.json();
                    if (status.status === "PENDING" || status.status === "THROTTLED") {
                        showMessage("⏳ Your video is waiting in the queue...");
                    } else if (status.status === "RUNNING") {
                        showMessage("🎬 AI is generating your video...");
                    }


                    if (!statusResponse.ok) {
                        throw new Error(
                            status.error || "Status check failed"
                        );
                    }

                    if (status.status === "SUCCEEDED") {
                        if (!status.video_url) {
                            throw new Error(
                                "No video URL returned"
                            );
                        }

                        videoBox.replaceChildren();

                        const video =
                            document.createElement("video");

                        video.controls = true;
                        video.playsInline = true;
                        video.src = status.video_url;

                        videoBox.appendChild(video);
                        
                        const downloadButton = document.createElement("button");

                        downloadButton.textContent = "⬇ Download Video";

                        downloadButton.onclick = () => {
                        const link = document.createElement("a");
                        link.href = status.video_url;
                        link.download = "AI_Video_Studio.mp4";
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                        link.click();
                        };

                       
                        document.getElementById("downloadArea").appendChild(downloadButton);
                        
                        await loadGallery();
                        
                        return;
                    }

                    
                    if (status.status === "FAILED") {
                        showMessage("❌ Video generation failed. Please try again.");

                        button.disabled = false;

                        await loadGallery();

                        return;
                    }


                    showMessage(
                        "Generating: " + status.status
                    );
                }

                showMessage(
                    "Still processing. Please try later."
                );

            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
